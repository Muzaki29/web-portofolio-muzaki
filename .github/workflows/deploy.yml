name: Deploy Portfolio Website

on:
  push:
    branches: [main]

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Verify SSH connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: "true"

      - name: Deploy reviewed source artifact
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu
            umask 077
            incoming="$HOME/portfolio-incoming/${{ github.sha }}"
            mkdir -p "$incoming/source"
            curl --fail --location --retry 3 --connect-timeout 10 --max-time 180 "https://api.github.com/repos/Muzaki29/web-portofolio-muzaki/tarball/${{ github.sha }}" --output "$incoming/source.tar.gz"
            tar -xzf "$incoming/source.tar.gz" --strip-components=1 -C "$incoming/source"
            tar -cf "$incoming/release.tar" -C "$incoming/source" app bootstrap config database lang public resources routes scripts artisan composer.json composer.lock package.json package-lock.json vite.config.js
            bash "$incoming/source/scripts/deploy-production.sh" "$incoming/release.tar" '${{ github.sha }}'
